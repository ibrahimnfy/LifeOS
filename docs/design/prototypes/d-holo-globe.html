<!-- Clickable prototype for #186. Self-contained: no network, no fonts, no libraries. All content is invented placeholder data. -->
<style>
/* ===== Shared: P2 tokens, app frame, top bar, pages, command bar =====
 * The same block is inlined in both prototypes on purpose, so each file
 * stays self-contained and the command bar behaves identically in both.
 * Tokens: D3 base + P2 tones, as in docs/design/mockups/README.md.
 */
:root {
  --bg: #f8f8fa; --surface: #eeeef2; --surface-2: #e3e3e9; --divider: #d9d9e1;
  --text: #17171c; --muted: #595966;
  --primary: #1e60e6; --on-primary: #ffffff; --link: #1852c8;
  --badge: #d62438; --ok: #177a41;
  --grad-1: #6a5cf2; --grad-2: #d845a4; --grad-3: #e8651e; --ring-w: 3px;
  --wm-alpha: 0.08;
  --violet: #f0edfc; --violet-2: #e0dafa; --violet-ink: #5443c4;
  --peach: #fcefe5; --peach-2: #f8dcc6; --peach-ink: #9a420c;
  --mint: #e8f5ee; --mint-2: #cdeadb; --mint-ink: #176b45;
  --sky: #e8f1fb; --sky-2: #cfe2f7; --sky-ink: #1b5ca3;
  --rose: #fbecef; --rose-2: #f6d4db; --rose-ink: #a8233c;
  --sand: #f9f2dc; --sand-2: #f0e1ae; --sand-ink: #765700;
  --teal: #e4f4f2; --teal-2: #c6e7e3; --teal-ink: #0d6862;
  --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 6px 16px rgba(0, 0, 0, 0.06);
  --lift-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
  --scrim: rgba(16, 18, 24, 0.32);
  color-scheme: light;
}
/* Dark theme: follows the system, or the theme button (data-theme). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101218; --surface: #1a1d25; --surface-2: #252933; --divider: #303541;
    --text: #ecedf2; --muted: #a1a5b1;
    --primary: #2165e8; --on-primary: #ffffff; --link: #7dafff;
    --badge: #dc2a3e; --ok: #45d688;
    --grad-1: #8577ff; --grad-2: #ec5fb2; --grad-3: #ff9458;
    --violet: #1e1c31; --violet-2: #2c2850; --violet-ink: #b5aaff;
    --peach: #261e19; --peach-2: #3b2b20; --peach-ink: #ffb17a;
    --mint: #16241e; --mint-2: #1e3a2d; --mint-ink: #7cdba8;
    --sky: #152030; --sky-2: #1d324a; --sky-ink: #8ec5ff;
    --rose: #28191e; --rose-2: #42232c; --rose-ink: #ff9cae;
    --sand: #24200f; --sand-2: #3a3218; --sand-ink: #efcd6a;
    --teal: #132423; --teal-2: #1a3a38; --teal-ink: #6ed6cd;
    --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(0, 0, 0, 0.25);
    --lift-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101218; --surface: #1a1d25; --surface-2: #252933; --divider: #303541;
  --text: #ecedf2; --muted: #a1a5b1;
  --primary: #2165e8; --on-primary: #ffffff; --link: #7dafff;
  --badge: #dc2a3e; --ok: #45d688;
  --grad-1: #8577ff; --grad-2: #ec5fb2; --grad-3: #ff9458;
  --violet: #1e1c31; --violet-2: #2c2850; --violet-ink: #b5aaff;
  --peach: #261e19; --peach-2: #3b2b20; --peach-ink: #ffb17a;
  --mint: #16241e; --mint-2: #1e3a2d; --mint-ink: #7cdba8;
  --sky: #152030; --sky-2: #1d324a; --sky-ink: #8ec5ff;
  --rose: #28191e; --rose-2: #42232c; --rose-ink: #ff9cae;
  --sand: #24200f; --sand-2: #3a3218; --sand-ink: #efcd6a;
  --teal: #132423; --teal-2: #1a3a38; --teal-ink: #6ed6cd;
  --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(0, 0, 0, 0.25);
  --lift-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
:root {
  --grad: linear-gradient(135deg, var(--grad-1), var(--grad-2), var(--grad-3));
  --font-ui: system-ui, -apple-system, "Segoe UI", "Roboto", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  /* Material 3 motion: emphasized easing and durations. */
  --ease-emph-dec: cubic-bezier(0.05, 0.7, 0.1, 1);
  --ease-emph-acc: cubic-bezier(0.3, 0, 0.8, 0.15);
  --ease-std: cubic-bezier(0.2, 0, 0, 1);
  --dur-enter: 420ms; --dur-exit: 260ms; --dur-short: 160ms;
  --pad: 16px;
}
@media (prefers-reduced-motion: reduce) {
  :root { --dur-enter: 1ms; --dur-exit: 1ms; --dur-short: 1ms; }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--surface-2); color: var(--text);
  font: 400 0.9375rem/1.4 var(--font-ui);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; opacity: 0.45; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums; }

.icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon .solid { fill: currentColor; stroke: none; }

/* One phone-width column; on a wide screen it is centred. */
.app {
  position: relative; margin: 0 auto; width: 100%; max-width: 480px; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; overflow: hidden; background: var(--bg);
}

/* Top bar: bold title, connection dot, line-icon buttons (48 dp hit areas). */
.topbar { flex: none; display: flex; align-items: center; gap: 0; min-height: 56px; padding: 4px 4px 0 var(--pad); }
.tb-text { flex: 1; min-width: 0; }
.tb-title { font-size: 1.4375rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-sub { font-size: 0.8125rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-dot { flex: none; width: 8px; height: 8px; margin: 0 8px 0 6px; border-radius: 50%; background: var(--ok); }
.tb-btn {
  flex: none; position: relative; display: inline-flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; border-radius: 50%; color: var(--text);
}
.tb-btn .lbl { font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.02em; }
.tb-btn::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: transparent; transition: background var(--dur-short); }
.tb-btn:hover::before { background: var(--surface); }
.tb-btn[aria-pressed="true"]::before { background: var(--surface-2); }
.tb-btn > * { position: relative; }

/* Tones: a section or a course keeps one colour and one icon (P2). */
.tone-violet { --card: var(--violet); --card-2: var(--violet-2); --ink: var(--violet-ink); }
.tone-peach { --card: var(--peach); --card-2: var(--peach-2); --ink: var(--peach-ink); }
.tone-mint { --card: var(--mint); --card-2: var(--mint-2); --ink: var(--mint-ink); }
.tone-sky { --card: var(--sky); --card-2: var(--sky-2); --ink: var(--sky-ink); }
.tone-rose { --card: var(--rose); --card-2: var(--rose-2); --ink: var(--rose-ink); }
.tone-sand { --card: var(--sand); --card-2: var(--sand-2); --ink: var(--sand-ink); }
.tone-teal { --card: var(--teal); --card-2: var(--teal-2); --ink: var(--teal-ink); }
.ctx {
  display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; height: 20px; padding: 0 8px 0 6px;
  border-radius: 10px; background: var(--card-2); color: var(--ink); font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden;
}
.ctx .icon { width: 13px; height: 13px; stroke-width: 2; }
.wm { position: absolute; top: -22px; right: -26px; width: 120px; height: 120px; color: var(--ink, var(--text)); opacity: var(--wm-alpha); pointer-events: none; }
.wm .icon { width: 100%; height: 100%; stroke-width: 1; }

/* ===== Feature pages (opened from a tile or a region) ===== */
.page {
  position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
  background: var(--bg); will-change: clip-path;
}
.page[hidden] { display: none; }
.page-head { flex: none; display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 4px 8px 0 4px; }
.page-head h1 { flex: 1; min-width: 0; font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-head h1:focus { outline: none; }
.page-head h1:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
.page-ico { flex: none; display: inline-flex; width: 36px; height: 36px; align-items: center; justify-content: center; border-radius: 50%; background: var(--card-2, var(--surface-2)); color: var(--ink, var(--text)); }
.page-ico .icon { width: 20px; height: 20px; }
.page-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px var(--pad) calc(var(--dock-h, 120px) + 16px); display: flex; flex-direction: column; gap: 14px; }
.page-content { opacity: 1; transition: opacity var(--dur-short) linear; }
.page.entering .page-content { opacity: 0; }

.panel { position: relative; overflow: hidden; isolation: isolate; padding: 8px 14px 6px; border: 1px solid var(--divider); border-radius: 20px; background: var(--surface); box-shadow: var(--card-shadow); }
.panel > :not(.wm) { position: relative; }
.panel h2 { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
.panel h2 .icon { width: 18px; height: 18px; stroke-width: 1.75; color: var(--ink, var(--text)); }
.panel h2 .meta { margin-left: auto; font-size: 0.8125rem; font-weight: 400; color: var(--muted); }
.coach-card { border: var(--ring-w) solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box; padding: 12px 15px 14px; }
.coach-msg { font-size: 1.125rem; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; }
.coach-why { margin-top: 6px; font-size: 0.84375rem; color: var(--muted); }
.coach-tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; border: 2px solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box; font-size: 0.75rem; font-weight: 700; }
.coach-tag .icon { width: 14px; height: 14px; stroke-width: 2; }

.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 56px; border-top: 1px solid var(--divider); }
.row-main { flex: 1; min-width: 0; }
.row-t { font-size: 0.9375rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.row-s { margin-top: 2px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--muted); }
.mark { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: var(--card-2, var(--surface-2)); color: var(--ink, var(--text)); font-weight: 700; }
.mark .icon { width: 20px; height: 20px; }
.check-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin: 0 -2px; border-radius: 50%; }
.check-btn .ring { width: 24px; height: 24px; border: 2px solid var(--ink, var(--muted)); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--bg); }
.check-btn .ring .icon { width: 16px; height: 16px; stroke-width: 2.5; visibility: hidden; }
.check-btn[aria-checked="true"] .ring { background: var(--ink, var(--text)); }
.check-btn[aria-checked="true"] .ring .icon { visibility: visible; }
.row.done .row-t { color: var(--muted); text-decoration: line-through; }
.chev { flex: none; color: var(--muted); }
.chev .icon { width: 18px; height: 18px; }
.bars { display: block; width: 100%; height: auto; }
.bars rect.b { fill: var(--teal-2); }
.bars rect.b.est { fill: url(#hatch); }
.bars text { font: 600 10.5px var(--font-ui); fill: var(--muted); }
.bars line { stroke: var(--teal-ink); stroke-width: 1.5; stroke-dasharray: 4 3; }
.stat-row { display: flex; gap: 10px; }
.stat { flex: 1; padding: 10px 12px; border-radius: 14px; background: var(--card-2, var(--surface-2)); }
.stat b { display: block; font-size: 1.25rem; letter-spacing: -0.01em; }
.stat span { font-size: 0.8125rem; color: var(--muted); }
.note-p { padding: 4px 0 10px; font-size: 0.875rem; color: var(--muted); }

/* ===== Command bar (the primary way to do things), bottom of the screen ===== */
.dock {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px;
  background: linear-gradient(to bottom, transparent, var(--bg) 22px);
  pointer-events: none;
}
.dock > * { pointer-events: auto; }
.cmd {
  display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 4px 4px 4px 6px; border-radius: 28px;
  border: var(--ring-w) solid transparent;
  background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box;
  box-shadow: var(--card-shadow);
}
.cmd-plus { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: var(--muted); }
.cmd input {
  flex: 1; min-width: 0; height: 48px; border: 0; outline: 0; background: transparent; color: var(--text);
  font: 500 1rem var(--font-ui);
}
.cmd input::placeholder { color: var(--muted); }
.cmd:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 35%, transparent), var(--card-shadow); }
.cmd-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; color: var(--text); }
.cmd-btn.send { background: var(--primary); color: var(--on-primary); }
.cmd-btn.send[hidden] { display: none; }
.cmd-btn.mic[aria-pressed="true"] { background: var(--badge); color: #fff; }
.cmd.listening input::placeholder { color: var(--text); font-weight: 600; }
.levels { display: none; gap: 3px; align-items: center; height: 20px; margin-right: 4px; }
.cmd.listening .levels { display: inline-flex; }
.levels i { display: block; width: 4px; height: 8px; border-radius: 2px; background: var(--badge); animation: lv 900ms ease-in-out infinite; }
.levels i:nth-child(2) { animation-delay: -300ms; } .levels i:nth-child(3) { animation-delay: -600ms; } .levels i:nth-child(4) { animation-delay: -150ms; }
@keyframes lv { 0%, 100% { height: 6px; } 50% { height: 20px; } }
@media (prefers-reduced-motion: reduce) { .levels i { animation: none; height: 14px; } }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.chips[hidden] { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 14px; border-radius: 24px;
  border: 1px solid var(--divider); background: var(--bg); font-size: 0.875rem; font-weight: 600; white-space: nowrap; color: var(--text);
}
.chip .icon { width: 18px; height: 18px; }
.chip.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

/* Confirmation with Undo, and the clarifying question, sit just above the bar. */
.bubble {
  display: flex; flex-direction: column; gap: 6px; padding: 10px 6px 6px 14px; border-radius: 18px;
  background: var(--text); color: var(--bg); box-shadow: var(--lift-shadow);
  animation: rise var(--dur-enter) var(--ease-emph-dec);
}
.bubble[hidden] { display: none; }
.bubble-row { display: flex; align-items: center; gap: 8px; }
.bubble-t { flex: 1; min-width: 0; font-size: 0.875rem; line-height: 1.35; }
.bubble-t b { font-weight: 700; }
.bubble .act { flex: none; min-height: 48px; min-width: 48px; padding: 0 12px; border-radius: 24px; font-weight: 700; font-size: 0.875rem; color: color-mix(in srgb, var(--primary) 45%, var(--bg)); }
.bubble.ask { background: var(--surface); color: var(--text); border: 1px solid var(--divider); padding: 10px 10px 10px 14px; }
.bubble.ask .q { display: flex; align-items: center; gap: 8px; font-size: 0.9375rem; font-weight: 600; }
.bubble.ask .q .icon { width: 18px; height: 18px; color: var(--primary); }
.bubble.ask .opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--divider); background: var(--bg); text-align: left; font-size: 0.875rem; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
.opt .s { color: var(--muted); font-size: 0.8125rem; }
.bubble.ask .act { color: var(--link); align-self: flex-end; }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }

/* Prototype badge: says what this is, opens nothing. */
.proto-note { font-size: 0.75rem; color: var(--muted); }
/* ===== Shared by the sci-fi prototypes (C, D, E): HUD field, list view ===== */
:root {
  --field: #f1f2f6; --grid-line: rgba(24, 82, 200, 0.07); --scan: rgba(24, 82, 200, 0.025);
  --hud: #1852c8; --hud-dim: #595966; --glass: rgba(248, 248, 250, 0.86);
  --font-hud: ui-monospace, "Cascadia Mono", "Roboto Mono", "Noto Sans Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --field: #080b12; --grid-line: rgba(125, 175, 255, 0.07); --scan: rgba(125, 175, 255, 0.03); --hud: #7dafff; --hud-dim: #a1a5b1; --glass: rgba(16, 18, 24, 0.78); }
}
:root[data-theme="dark"] { --field: #080b12; --grid-line: rgba(125, 175, 255, 0.07); --scan: rgba(125, 175, 255, 0.03); --hud: #7dafff; --hud-dim: #a1a5b1; --glass: rgba(16, 18, 24, 0.78); }

.app { background: var(--field); }
.topbar { position: relative; z-index: 5; background: linear-gradient(to bottom, var(--field) 70%, transparent); }
.field {
  position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  background:
    repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 4px),
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 32px 32px;
}
.field[hidden] { display: none; }
.hud-cap {
  position: absolute; z-index: 1; font: 600 0.6875rem/1.2 var(--font-hud); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--hud-dim); pointer-events: none;
}
.hud-cap b { color: var(--hud); font-weight: 700; }
.hud-corner { position: absolute; width: 18px; height: 18px; border-color: var(--hud); opacity: 0.45; pointer-events: none; }
.hud-corner.tl { top: 8px; left: 8px; border-top: 2px solid; border-left: 2px solid; }
.hud-corner.tr { top: 8px; right: 8px; border-top: 2px solid; border-right: 2px solid; }
.hud-corner.bl { bottom: calc(var(--dock-h, 120px) + 4px); left: 8px; border-bottom: 2px solid; border-left: 2px solid; }
.hud-corner.br { bottom: calc(var(--dock-h, 120px) + 4px); right: 8px; border-bottom: 2px solid; border-right: 2px solid; }

/* Glow in the feature's own tone (P2 ink), legible text on glass. */
.glow { --gl: var(--ink, var(--hud)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--gl) 70%, transparent), 0 0 16px color-mix(in srgb, var(--gl) 38%, transparent); }
.coach.glow, .glow.coach { --gl: var(--grad-2); }

/* The accessible alternative: every feature as a plain list. */
.hud-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px var(--pad) calc(var(--dock-h, 120px) + 16px); display: flex; flex-direction: column; gap: 8px; }
.hud-list[hidden] { display: none; }
.hud-row {
  width: 100%; display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 12px; border-radius: 20px; text-align: left;
  border: 1px solid var(--divider); background: var(--surface);
}
.hud-row.coach { border: var(--ring-w) solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box; }

.holo { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
.holo.zoom { transition: transform 380ms var(--ease-emph-acc), opacity 380ms linear; }
.holo canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cards { position: absolute; inset: 0; pointer-events: none; }
.pcard {

  background: var(--glass); color: var(--text);
  border: 1px solid color-mix(in srgb, var(--ink, var(--grad-2)) 65%, transparent);
  box-shadow: 0 0 14px color-mix(in srgb, var(--ink, var(--grad-2)) 30%, transparent);
  will-change: transform, opacity;
}
.pcard.coach { border-color: color-mix(in srgb, var(--grad-2) 70%, transparent); }
.pcard::after { /* the little pointer down to the pin */
  content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; margin-left: -5px; transform: rotate(45deg);

}

  /* ---------- history: the system back gesture closes a page ---------- */

    back: function (closeFn) { if (Nav.pushed) { history.back(); } else { closeFn(); } },

  /* ---------- reduced motion ---------- */

  /* ---------- command bar ---------- */
  // A mock of the command bar of #185: the request becomes an app action, the
  // result shows a confirmation with Undo; an ambiguous one gets one short question.
  var Cmd = (function () {
    var hooks, input, form, micBtn, sendBtn, chips, bubble, listenTimer = null, bubbleTimer = null, voiceTurn = 0;
    var SUGGEST = [
      { icon: "tasks", text: L("Remind me to call Project X tomorrow at 9:00", "Yarın 9:00'da Proje X'i aramamı hatırlat") },
      { icon: "calendar", text: L("Move the meeting to 15:00", "Toplantıyı 15:00'e taşı") },
      { icon: "note", text: L("Note: buy printer paper", "Not: yazıcı kâğıdı al") },
      { icon: "book", text: L("Open courses", "Dersleri aç") }
    ];
    var VOICE = [SUGGEST[1].text, SUGGEST[0].text];

    // After a tap, focus goes to the mic button (no soft keyboard pops up);
    // after a key press, back to the text field.
    var byKey = false;
    document.addEventListener("keydown", function () { byKey = true; }, true);
    document.addEventListener("pointerdown", function () { byKey = false; }, true);
    function refocus() { (byKey ? input : micBtn).focus({ preventScroll: true }); }
    function init(h) {
      hooks = h;
      form = document.getElementById("cmd");
      input = document.getElementById("cmd-input");
      micBtn = document.getElementById("cmd-mic");
      sendBtn = document.getElementById("cmd-send");
      chips = document.getElementById("chips");
      bubble = document.getElementById("bubble");
      form.addEventListener("submit", function (e) { e.preventDefault(); run(input.value); });
      input.addEventListener("input", syncButtons);
      input.addEventListener("focus", function () { showChips(true); });
      input.addEventListener("blur", function () { setTimeout(function () { if (!chips.contains(document.activeElement)) showChips(false); }, 150); });
      input.addEventListener("keydown", function (e) { if (e.key === "Escape") { input.value = ""; syncButtons(); hideBubble(); input.blur(); } });
      micBtn.addEventListener("click", toggleListen);
      chips.addEventListener("click", function (e) {
        var b = e.target.closest("[data-sugg]");
        if (!b) return;
        input.value = tx(SUGGEST[+b.getAttribute("data-sugg")].text);
        syncButtons();
        run(input.value);
      });
      bubble.addEventListener("click", function (e) {
        var b = e.target.closest("[data-bact]");
        if (b && bubble._handlers && bubble._handlers[b.getAttribute("data-bact")]) bubble._handlers[b.getAttribute("data-bact")]();
      });
      // A confirmation stays while it has focus or the pointer (no surprise timeouts).
      ["focusin", "pointerenter"].forEach(function (ev) { bubble.addEventListener(ev, function () { clearTimeout(bubbleTimer); }); });
      ["focusout", "pointerleave"].forEach(function (ev) { bubble.addEventListener(ev, function () { if (bubble.classList.contains("ok")) armBubbleTimer(); }); });
      render();
      syncButtons();
    }
    function render() {
      chips.innerHTML = SUGGEST.map(function (s, i) { return '<button type="button" class="chip" data-sugg="' + i + '">' + icon(s.icon) + esc(tx(s.text)) + "</button>"; }).join("");
      chips.setAttribute("aria-label", t("suggestions"));
      if (bubble._render) bubble._render();
    }
    function showChips(on) { chips.hidden = !on || !!input.value || !bubble.hidden; hooks.layout && hooks.layout(); }
    function syncButtons() {
      sendBtn.hidden = !input.value.trim();
      if (input.value) chips.hidden = true;
      hooks.layout && hooks.layout();
    }
    function toggleListen() {
      if (listenTimer) { stopListen(); return; }
      hideBubble();
      form.classList.add("listening");
      micBtn.setAttribute("aria-pressed", "true");
      micBtn.setAttribute("aria-label", t("stopListening"));
      input.value = "";
      input.setAttribute("placeholder", t("listening"));
      syncButtons();
      announce(t("listening"));
      listenTimer = setTimeout(function () {
        var phrase = tx(VOICE[voiceTurn++ % VOICE.length]);
        stopListen();
        input.value = phrase;
        syncButtons();
        setTimeout(function () { run(input.value); }, reducedMotion() ? 200 : 600);
      }, 1800);
    }
    function stopListen() {
      clearTimeout(listenTimer); listenTimer = null;
      form.classList.remove("listening");
      micBtn.setAttribute("aria-pressed", "false");
      micBtn.setAttribute("aria-label", t("speak"));
      input.setAttribute("placeholder", t("cmdPh"));
    }

    /* ----- bubble: confirmation with Undo, or the clarifying question ----- */
    function armBubbleTimer() { clearTimeout(bubbleTimer); bubbleTimer = setTimeout(hideBubble, 10000); }
    function showBubble(kind, renderFn, handlers, keepFocus) {
      bubble._render = function () { bubble.innerHTML = renderFn(); };
      bubble._handlers = handlers;
      bubble.className = "bubble " + kind;
      bubble._render();
      bubble.hidden = false;
      chips.hidden = true;
      if (kind === "ok") armBubbleTimer(); else clearTimeout(bubbleTimer);
      hooks.layout && hooks.layout();
      if (!keepFocus && kind === "ask") { var first = bubble.querySelector(".opt"); if (first) first.focus(); }
    }
    function hideBubble() {
      clearTimeout(bubbleTimer);
      var hadFocus = bubble.contains(document.activeElement);
      bubble.hidden = true; bubble._render = null; bubble._handlers = null; bubble.innerHTML = "";
      if (hadFocus) refocus();
      hooks.layout && hooks.layout();
    }
    function confirm(textFn, undoFn, extra) {
      var handlers = {
        undo: function () { undoFn(); hideBubble(); hooks.refresh(); announce(t("undone")); },
        close: hideBubble
      };
      if (extra) handlers.extra = function () { hideBubble(); extra.fn(); };
      showBubble("ok", function () {
        return '<div class="bubble-row"><p class="bubble-t">' + textFn() + "</p>" +
          (extra ? '<button class="act" data-bact="extra">' + esc(t(extra.label)) + "</button>" : "") +
          '<button class="act" data-bact="undo">' + esc(t("undo")) + "</button>" +
          '<button class="act" data-bact="close" aria-label="' + esc(t("dismiss")) + '" style="padding:0;width:48px;display:inline-flex;align-items:center;justify-content:center">' + icon("close") + "</button></div>";
      }, handlers);
      var tmp = document.createElement("div"); tmp.innerHTML = textFn();
      announce(tmp.textContent + ". " + (extra ? t(extra.label) + ", " : "") + t("undo") + ".");
    }

    /* ----- the mock interpreter ----- */
    function findFeature(s) {
      var best = null;
      ORDER.forEach(function (id) {
        var f = FEATURES[id];
        [f.name.en, f.name.tr].forEach(function (n) {
          lower(n).split(/\s+/).forEach(function (w) {
            var stem = w.replace(/[’'].*$/, "");
            if (stem.length > 3 && s.indexOf(stem.slice(0, Math.max(4, stem.length - 2))) >= 0 && !best) best = id;
          });
        });
      });
      if (!best && /(calendar|takvim|meeting|toplant)/.test(s)) best = "agenda";
      if (!best && /(sleep|uyku|screen|ekran)/.test(s)) best = "activity";
      if (!best && /(task|görev)/.test(s)) best = "today";
      return best;
    }
    function timeIn(s) { var m = s.match(/(\d{1,2})[:.](\d{2})/); return m ? ("0" + m[1]).slice(-2) + ":" + m[2] : null; }
    function cleanTask(raw) {
      var s = raw.trim()
        .replace(/^(please\s+)?(remind me to|remind me|add (a )?task( to)?|task:?|todo:?)\s*/i, "")
        .replace(/\s*(bana\s+)?(hatırlat|görev ekle)\.?$/i, "")
        .replace(/^(görev:?)\s*/i, "")
        .replace(/\s*(tomorrow|yarın)\b/i, "")
        .replace(/\s*(at\s+)?\d{1,2}[:.]\d{2}('?d[ae])?/i, "").replace(/\s+/g, " ").trim();
      if (!s) s = raw.trim();
      return s.charAt(0).toLocaleUpperCase(lang === "tr" ? "tr" : "en") + s.slice(1);
    }
    function cleanNote(raw) { var s = raw.replace(/^\s*(note|not)\s*:?\s*/i, "").replace(/^(take a note|not al)\s*:?\s*/i, "").trim(); return s ? s.charAt(0).toLocaleUpperCase(lang === "tr" ? "tr" : "en") + s.slice(1) : raw; }
    function ctxIn(s) {
      var k = null;
      Object.keys(CTX).forEach(function (key) { if (!k && (s.indexOf(lower(CTX[key].name.en)) >= 0 || s.indexOf(lower(CTX[key].name.tr)) >= 0)) k = key; });
      return k;
    }

    function run(raw) {
      var text = String(raw || "").trim();
      if (!text) return;
      stopListen();
      var s = lower(text);
      input.value = ""; syncButtons();
      var tm = timeIn(s);

      if (/\b(move|reschedule|shift)\b|taşı|ertele|kaydır/.test(s)) {
        var ctxk = ctxIn(s);
        var meetings = DATA.events.filter(function (e) { return e.meeting && (!ctxk || e.ctx === ctxk); });
        if (meetings.length === 1) return moveEvent(meetings[0], tm || "15:00");
        return askWhich(DATA.events.filter(function (e) { return e.meeting; }), tm || "15:00");
      }
      if (/^(open|show|go to)\b|(^|\s)(aç|göster)(\s|$)|açar mısın/.test(s)) {
        var f = findFeature(s);
        if (f) { hooks.open(f, "command"); announce(t("opened") + ": " + tx(FEATURES[f].name)); return; }
      }
      if (/^(note|not)\b\s*:?|take a note|not al/.test(s)) return addNote(cleanNote(text));
      if (/remind|task|todo|^add\b|hatırlat|görev|ekle/.test(s)) return addTask(cleanTask(text), /tomorrow|yarın/.test(s) ? "tomorrow" : "today", tm, ctxIn(s));
      return askAssistant(text);
    }
    function addTask(txt, day, time, ctxk) {
      var item = { id: ++uid, text: txt, ctx: ctxk, day: day, done: false, time: time };
      DATA.tasks.push(item);
      hooks.refresh();
      confirm(function () {
        return "<b>" + esc(t("taskAdded")) + "</b> · " + esc(txt) + " · " + esc(t(day)) + (time ? " " + esc(time) : "");
      }, function () { DATA.tasks.splice(DATA.tasks.indexOf(item), 1); }, { label: "open", fn: function () { hooks.open("today", "command"); } });
    }
    function addNote(txt) {
      var item = { id: ++uid, text: txt, when: L("Now", "Şimdi") };
      DATA.notes.unshift(item);
      hooks.refresh();
      confirm(function () { return "<b>" + esc(t("noteAdded")) + "</b> · " + esc(txt); }, function () { DATA.notes.splice(DATA.notes.indexOf(item), 1); });
    }
    function moveEvent(ev, time) {
      var old = { time: ev.time, day: ev.day };
      ev.time = time;
      hooks.refresh();
      confirm(function () { return "<b>" + esc(t("moved")) + "</b> · " + esc(tx(ev.text)) + " " + esc(t("to")) + " " + esc(t(ev.day)) + " " + esc(time); },
        function () { ev.time = old.time; ev.day = old.day; });
    }
    function askWhich(list, time) {
      var handlers = { cancel: function () { hideBubble(); announce(t("cancel")); } };
      list.forEach(function (ev, i) { handlers["o" + i] = function () { hideBubble(); moveEvent(ev, time); }; });
      showBubble("ask", function () {
        return '<p class="q" id="ask-q">' + icon("question") + esc(t("whichMeeting")) + '</p><div class="opts" role="group" aria-labelledby="ask-q">' + list.map(function (ev, i) {
          return '<button class="opt" data-bact="o' + i + '"><span class="k">' + (i + 1) + '</span><span><b>' + esc(tx(ev.text)) + '</b><br><span class="s">' + esc(t(ev.day)) + " · " + esc(ev.time) + " → " + esc(time) + "</span></span></button>";

    cardEls = PINS.map(function (p, i) {
      var f = F[p.id], b = document.createElement("button");
      b.type = "button"; b.className = "pcard" + (f.tone ? " tone-" + f.tone : " coach"); b.setAttribute("data-i", i);
      cards.appendChild(b); return b;
    });
    fillCards();
  }
  function fillCards() {
    cardEls.forEach(function (b, i) {
      var id = PINS[i].id;
      b.innerHTML = '<span class="pc-name">' + esc(tx(F[id].name)) + '</span><span class="pc-live">' + esc(Hud.live(id)) + "</span>";
      b.setAttribute("aria-label", Hud.label(id));
      b._w = 0;
    });
    $("cap-holo").textContent = t("capHolo"); $("cap-hint").textContent = t("capHint");
    holo.setAttribute("aria-label", t("globeLabel"));
  }
  function placeCards() {
    if (cardEls.length !== NP) return;
    var order = PINS.map(function (p, i) { return i; }).sort(function (a, b) { return PINS[b].vz - PINS[a].vz; });
    var placed = [];
    order.forEach(function (i) {
      var p = PINS[i], b = cardEls[i];
      if (!b._w) { b._w = b.offsetWidth; b._h = b.offsetHeight; }
      var vis = Math.max(0, Math.min(1, (p.vz - 0.12) / 0.25));
      var x = Math.max(4, Math.min(W - b._w - 4, p.sx - b._w / 2)), y = p.sy - b._h - 14;
      var box = { l: x, t: y, r: x + b._w, b: y + b._h };
      if (vis > 0) for (var k = 0; k < placed.length; k++) { var o = placed[k]; if (box.l < o.r && box.r > o.l && box.t < o.b && box.b > o.t) { vis = 0; break; } }
      if (vis > 0.5) placed.push(box);
      b.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
      b.style.opacity = i === focusI ? "1" : vis.toFixed(2);
      b.style.zIndex = String(100 + Math.round(p.vz * 100));
      b.classList.toggle("off", vis < 0.5 && i !== focusI);
    });
  }

  /* ---------- motion ---------- */
  var IDLE_SPEED = 0.00012, IDLE_FOR = 25000; // rad/ms; the idle turn stops after 25 s
  function wakeIdle(delay) { if (!S.reducedMotion()) { idleUntil = performance.now() + IDLE_FOR; idleFrom = performance.now() + (delay || 0); } }
  var idleFrom = 0;
  function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); } }
  function step(now) {
    raf = 0;
    var dt = Math.min(48, now - last); last = now;
    var moving = false;
    if (anim) {
      var k = Math.min(1, (now - anim.t0) / anim.dur), e = 1 - Math.pow(1 - k, 3);
      yaw = anim.y0 + anim.dy * e; pitch = anim.p0 + anim.dp * e;
      if (k < 1) moving = true; else { var done = anim.done; anim = null; if (done) done(); }
    } else if (drag) { moving = true; }
    else if (Math.abs(vYaw) > 0.00003 || Math.abs(vPitch) > 0.00003) {
      yaw += vYaw * dt; pitch += vPitch * dt; clampPitch();
      var dec = Math.exp(-dt / 400); vYaw *= dec; vPitch *= dec; moving = true;
    } else if (!Hud.isOpen() && now < idleUntil && focusI < 0) {
      if (now > idleFrom) yaw += IDLE_SPEED * dt * Math.min(1, (idleUntil - now) / 3000); // eases out at the end
      moving = true;
    }
    draw();
    if (moving) raf = requestAnimationFrame(step);
  }
  function clampPitch() { pitch = Math.max(-1.1, Math.min(1.1, pitch)); }
  function wrap(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
  function turnTo(i, dur, done) {
    vYaw = vPitch = 0;
    var ty = -PINS[i].lon * Math.PI / 180, tp = Math.max(-1.1, Math.min(1.1, PINS[i].lat * Math.PI / 180 * 0.8));
    var dy = wrap(ty - yaw), dp = tp - pitch;
    if (S.reducedMotion() || dur <= 0) { yaw += dy; pitch = tp; draw(); if (done) setTimeout(done, 0); return; }
    anim = { t0: performance.now(), dur: dur, y0: yaw, p0: pitch, dy: dy, dp: dp, done: done };
    kick();
  }

  /* ---------- input ---------- */
  var suppress = false;
  field.addEventListener("pointerdown", function (e) {
    if (Hud.isOpen() || (e.pointerType === "mouse" && e.button !== 0) || e.target.closest("#dock")) return;
    anim = null; vYaw = vPitch = 0; idleUntil = 0;
    drag = { pid: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
  });
  field.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
      drag.moved = true; try { field.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
    }
    var now = performance.now(), dt = Math.max(1, now - drag.t);
    var dyaw = (e.clientX - drag.x) / R, dp = (e.clientY - drag.y) / R;
    yaw += dyaw; pitch += dp; clampPitch();
    vYaw = 0.75 * (dyaw / dt) + 0.25 * vYaw; vPitch = 0.75 * (dp / dt) + 0.25 * vPitch;
    drag.x = e.clientX; drag.y = e.clientY; drag.t = now;
    kick();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    if (drag.moved) {
      suppress = true; setTimeout(function () { suppress = false; }, 0);
      if (S.reducedMotion() || performance.now() - drag.t > 90 || e.type === "pointercancel") vYaw = vPitch = 0;
    }
    drag = null; wakeIdle(2500); kick();
  }
  field.addEventListener("pointerup", endDrag);
  field.addEventListener("pointercancel", endDrag);
  field.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  field.addEventListener("click", function (e) {
    if (suppress) { suppress = false; return; }
    var b = e.target.closest(".pcard");
    if (b) { Hud.open(PINS[+b.getAttribute("data-i")].id); return; }
    if (e.target !== canvas) return;
    var r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, best = -1, bd = 34;
    PINS.forEach(function (p, i) { if (p.vz < 0) return; var d = Math.hypot(p.sx - x, p.sy - y); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) Hud.open(PINS[best].id);
  });
  holo.addEventListener("keydown", function (e) {
    var k = e.key, st = 0.3;
    if (k === "ArrowLeft") yaw += st; else if (k === "ArrowRight") yaw -= st; else if (k === "ArrowUp") pitch += st; else if (k === "ArrowDown") pitch -= st;
    else return;
    e.preventDefault(); clampPitch(); vYaw = vPitch = 0; idleUntil = 0; draw();
  });
  cards.addEventListener("focusin", function (e) {
    var b = e.target.closest(".pcard"); if (!b) return;
    focusI = +b.getAttribute("data-i"); idleUntil = 0;
    if (PINS[focusI].vz < 0.6) turnTo(focusI, 380); else draw();
  });
  cards.addEventListener("focusout", function () { focusI = -1; draw(); });

  /* ---------- opening: turn to the pin, zoom in, reveal ---------- */
  function pinPoint(id) { for (var i = 0; i < NP; i++) if (PINS[i].id === id) return i; return 0; }
  Hud.init({
    origin: function (id) { var p = PINS[pinPoint(id)], r = field.getBoundingClientRect(); return Hud.relPoint(r.left + p.sx, r.top + p.sy); },
    focusTarget: function (id) { return cardEls[pinPoint(id)]; },
    beforeOpen: function (id, go) {
      var i = pinPoint(id); idleUntil = 0;
      turnTo(i, 340, function () {
        if (!Hud.isOpen()) return; // closed again while turning
        if (S.reducedMotion()) { go(); return; }
        var p = PINS[i];
        holo.style.transformOrigin = p.sx + "px " + p.sy + "px";
        holo.classList.add("zoom");
        holo.style.transform = "scale(2.2)"; holo.style.opacity = "0.35";
        setTimeout(go, 140);
      });
    },
    beforeClose: function () {
      holo.classList.add("zoom"); holo.style.transform = ""; holo.style.opacity = "";
      setTimeout(function () { holo.classList.remove("zoom"); }, 400);
    },
    closed: function () { holo.classList.remove("zoom"); holo.style.transform = ""; holo.style.opacity = ""; wakeIdle(1500); kick(); },
    refresh: function () { if (cardEls.length) { fillCards(); draw(); } },
    onList: function (on) { if (!on) { layout(); } },
    layout: function () { layout(); },
    fieldIcon: "globe"
  });
  colours();
  buildCards();
  layout();
  window.addEventListener("resize", layout);
  document.addEventListener("lifeos-theme", function () { colours(); draw(); });
  wakeIdle(800); kick();
  // Test hooks for the prototype (not part of any design).
  window.__proto = {
    view: function () { return { yaw: yaw, pitch: pitch, vYaw: vYaw, vPitch: vPitch }; }, moving: function () { return !!raf; },
    drawMs: function () { var a = performance.now(); for (var i = 0; i < 10; i++) draw(); return (performance.now() - a) / 10; },
    stopIdle: function () { idleUntil = 0; }
  };
})();
</script>
</body>
</html>

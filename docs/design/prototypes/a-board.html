<!-- Clickable prototype for #186. Self-contained: no network, no fonts, no libraries. All content is invented placeholder data. -->
<style>
/* ===== Shared: P2 tokens, app frame, top bar, pages, command bar =====
 * The same block is inlined in both prototypes on purpose, so each file
 * stays self-contained and the command bar behaves identically in both.
 * Tokens: D3 base + P2 tones, as in docs/design/mockups/README.md.
 */
:root {
  --bg: #f8f8fa; --surface: #eeeef2; --surface-2: #e3e3e9; --divider: #d9d9e1;
  --text: #17171c; --muted: #595966;
  --primary: #1e60e6; --on-primary: #ffffff; --link: #1852c8;
  --badge: #d62438; --ok: #177a41;
  --grad-1: #6a5cf2; --grad-2: #d845a4; --grad-3: #e8651e; --ring-w: 3px;
  --wm-alpha: 0.08;
  --violet: #f0edfc; --violet-2: #e0dafa; --violet-ink: #5443c4;
  --peach: #fcefe5; --peach-2: #f8dcc6; --peach-ink: #9a420c;
  --mint: #e8f5ee; --mint-2: #cdeadb; --mint-ink: #176b45;
  --sky: #e8f1fb; --sky-2: #cfe2f7; --sky-ink: #1b5ca3;
  --rose: #fbecef; --rose-2: #f6d4db; --rose-ink: #a8233c;
  --sand: #f9f2dc; --sand-2: #f0e1ae; --sand-ink: #765700;
  --teal: #e4f4f2; --teal-2: #c6e7e3; --teal-ink: #0d6862;
  --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 6px 16px rgba(0, 0, 0, 0.06);
  --lift-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
  --scrim: rgba(16, 18, 24, 0.32);
  color-scheme: light;
}
/* Dark theme: follows the system, or the theme button (data-theme). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101218; --surface: #1a1d25; --surface-2: #252933; --divider: #303541;
    --text: #ecedf2; --muted: #a1a5b1;
    --primary: #2165e8; --on-primary: #ffffff; --link: #7dafff;
    --badge: #dc2a3e; --ok: #45d688;
    --grad-1: #8577ff; --grad-2: #ec5fb2; --grad-3: #ff9458;
    --violet: #1e1c31; --violet-2: #2c2850; --violet-ink: #b5aaff;
    --peach: #261e19; --peach-2: #3b2b20; --peach-ink: #ffb17a;
    --mint: #16241e; --mint-2: #1e3a2d; --mint-ink: #7cdba8;
    --sky: #152030; --sky-2: #1d324a; --sky-ink: #8ec5ff;
    --rose: #28191e; --rose-2: #42232c; --rose-ink: #ff9cae;
    --sand: #24200f; --sand-2: #3a3218; --sand-ink: #efcd6a;
    --teal: #132423; --teal-2: #1a3a38; --teal-ink: #6ed6cd;
    --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(0, 0, 0, 0.25);
    --lift-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101218; --surface: #1a1d25; --surface-2: #252933; --divider: #303541;
  --text: #ecedf2; --muted: #a1a5b1;
  --primary: #2165e8; --on-primary: #ffffff; --link: #7dafff;
  --badge: #dc2a3e; --ok: #45d688;
  --grad-1: #8577ff; --grad-2: #ec5fb2; --grad-3: #ff9458;
  --violet: #1e1c31; --violet-2: #2c2850; --violet-ink: #b5aaff;
  --peach: #261e19; --peach-2: #3b2b20; --peach-ink: #ffb17a;
  --mint: #16241e; --mint-2: #1e3a2d; --mint-ink: #7cdba8;
  --sky: #152030; --sky-2: #1d324a; --sky-ink: #8ec5ff;
  --rose: #28191e; --rose-2: #42232c; --rose-ink: #ff9cae;
  --sand: #24200f; --sand-2: #3a3218; --sand-ink: #efcd6a;
  --teal: #132423; --teal-2: #1a3a38; --teal-ink: #6ed6cd;
  --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(0, 0, 0, 0.25);
  --lift-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
:root {
  --grad: linear-gradient(135deg, var(--grad-1), var(--grad-2), var(--grad-3));
  --font-ui: system-ui, -apple-system, "Segoe UI", "Roboto", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  /* Material 3 motion: emphasized easing and durations. */
  --ease-emph-dec: cubic-bezier(0.05, 0.7, 0.1, 1);
  --ease-emph-acc: cubic-bezier(0.3, 0, 0.8, 0.15);
  --ease-std: cubic-bezier(0.2, 0, 0, 1);
  --dur-enter: 420ms; --dur-exit: 260ms; --dur-short: 160ms;
  --pad: 16px;
}
@media (prefers-reduced-motion: reduce) {
  :root { --dur-enter: 1ms; --dur-exit: 1ms; --dur-short: 1ms; }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--surface-2); color: var(--text);
  font: 400 0.9375rem/1.4 var(--font-ui);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; opacity: 0.45; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums; }

.icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon .solid { fill: currentColor; stroke: none; }

/* One phone-width column; on a wide screen it is centred. */
.app {
  position: relative; margin: 0 auto; width: 100%; max-width: 480px; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; overflow: hidden; background: var(--bg);
}

/* Top bar: bold title, connection dot, line-icon buttons (48 dp hit areas). */
.topbar { flex: none; display: flex; align-items: center; gap: 0; min-height: 56px; padding: 4px 4px 0 var(--pad); }
.tb-text { flex: 1; min-width: 0; }
.tb-title { font-size: 1.4375rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-sub { font-size: 0.8125rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-dot { flex: none; width: 8px; height: 8px; margin: 0 8px 0 6px; border-radius: 50%; background: var(--ok); }
.tb-btn {
  flex: none; position: relative; display: inline-flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; border-radius: 50%; color: var(--text);
}
.tb-btn .lbl { font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.02em; }
.tb-btn::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: transparent; transition: background var(--dur-short); }
.tb-btn:hover::before { background: var(--surface); }
.tb-btn[aria-pressed="true"]::before { background: var(--surface-2); }
.tb-btn > * { position: relative; }

/* Tones: a section or a course keeps one colour and one icon (P2). */
.tone-violet { --card: var(--violet); --card-2: var(--violet-2); --ink: var(--violet-ink); }
.tone-peach { --card: var(--peach); --card-2: var(--peach-2); --ink: var(--peach-ink); }
.tone-mint { --card: var(--mint); --card-2: var(--mint-2); --ink: var(--mint-ink); }
.tone-sky { --card: var(--sky); --card-2: var(--sky-2); --ink: var(--sky-ink); }
.tone-rose { --card: var(--rose); --card-2: var(--rose-2); --ink: var(--rose-ink); }
.tone-sand { --card: var(--sand); --card-2: var(--sand-2); --ink: var(--sand-ink); }
.tone-teal { --card: var(--teal); --card-2: var(--teal-2); --ink: var(--teal-ink); }
.ctx {
  display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; height: 20px; padding: 0 8px 0 6px;
  border-radius: 10px; background: var(--card-2); color: var(--ink); font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden;
}
.ctx .icon { width: 13px; height: 13px; stroke-width: 2; }
.wm { position: absolute; top: -22px; right: -26px; width: 120px; height: 120px; color: var(--ink, var(--text)); opacity: var(--wm-alpha); pointer-events: none; }
.wm .icon { width: 100%; height: 100%; stroke-width: 1; }

/* ===== Feature pages (opened from a tile or a region) ===== */
.page {
  position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
  background: var(--bg); will-change: clip-path;
}
.page[hidden] { display: none; }
.page-head { flex: none; display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 4px 8px 0 4px; }
.page-head h1 { flex: 1; min-width: 0; font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-head h1:focus { outline: none; }
.page-head h1:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
.page-ico { flex: none; display: inline-flex; width: 36px; height: 36px; align-items: center; justify-content: center; border-radius: 50%; background: var(--card-2, var(--surface-2)); color: var(--ink, var(--text)); }
.page-ico .icon { width: 20px; height: 20px; }
.page-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px var(--pad) calc(var(--dock-h, 120px) + 16px); display: flex; flex-direction: column; gap: 14px; }
.page-content { opacity: 1; transition: opacity var(--dur-short) linear; }
.page.entering .page-content { opacity: 0; }

.panel { position: relative; overflow: hidden; isolation: isolate; padding: 8px 14px 6px; border: 1px solid var(--divider); border-radius: 20px; background: var(--surface); box-shadow: var(--card-shadow); }
.panel > :not(.wm) { position: relative; }
.panel h2 { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
.panel h2 .icon { width: 18px; height: 18px; stroke-width: 1.75; color: var(--ink, var(--text)); }
.panel h2 .meta { margin-left: auto; font-size: 0.8125rem; font-weight: 400; color: var(--muted); }
.coach-card { border: var(--ring-w) solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box; padding: 12px 15px 14px; }
.coach-msg { font-size: 1.125rem; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; }
.coach-why { margin-top: 6px; font-size: 0.84375rem; color: var(--muted); }
.coach-tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; border: 2px solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box; font-size: 0.75rem; font-weight: 700; }
.coach-tag .icon { width: 14px; height: 14px; stroke-width: 2; }

.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 56px; border-top: 1px solid var(--divider); }
.row-main { flex: 1; min-width: 0; }
.row-t { font-size: 0.9375rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.row-s { margin-top: 2px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--muted); }
.mark { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: var(--card-2, var(--surface-2)); color: var(--ink, var(--text)); font-weight: 700; }
.mark .icon { width: 20px; height: 20px; }
.check-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin: 0 -2px; border-radius: 50%; }
.check-btn .ring { width: 24px; height: 24px; border: 2px solid var(--ink, var(--muted)); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--bg); }
.check-btn .ring .icon { width: 16px; height: 16px; stroke-width: 2.5; visibility: hidden; }
.check-btn[aria-checked="true"] .ring { background: var(--ink, var(--text)); }
.check-btn[aria-checked="true"] .ring .icon { visibility: visible; }
.row.done .row-t { color: var(--muted); text-decoration: line-through; }
.chev { flex: none; color: var(--muted); }
.chev .icon { width: 18px; height: 18px; }
.bars { display: block; width: 100%; height: auto; }
.bars rect.b { fill: var(--teal-2); }
.bars rect.b.est { fill: url(#hatch); }
.bars text { font: 600 10.5px var(--font-ui); fill: var(--muted); }
.bars line { stroke: var(--teal-ink); stroke-width: 1.5; stroke-dasharray: 4 3; }
.stat-row { display: flex; gap: 10px; }
.stat { flex: 1; padding: 10px 12px; border-radius: 14px; background: var(--card-2, var(--surface-2)); }
.stat b { display: block; font-size: 1.25rem; letter-spacing: -0.01em; }
.stat span { font-size: 0.8125rem; color: var(--muted); }
.note-p { padding: 4px 0 10px; font-size: 0.875rem; color: var(--muted); }

/* ===== Command bar (the primary way to do things), bottom of the screen ===== */
.dock {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px;
  background: linear-gradient(to bottom, transparent, var(--bg) 22px);
  pointer-events: none;
}
.dock > * { pointer-events: auto; }
.cmd {
  display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 4px 4px 4px 6px; border-radius: 28px;
  border: var(--ring-w) solid transparent;
  background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box;
  box-shadow: var(--card-shadow);
}
.cmd-plus { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: var(--muted); }
.cmd input {
  flex: 1; min-width: 0; height: 48px; border: 0; outline: 0; background: transparent; color: var(--text);
  font: 500 1rem var(--font-ui);
}
.cmd input::placeholder { color: var(--muted); }
.cmd:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 35%, transparent), var(--card-shadow); }
.cmd-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; color: var(--text); }
.cmd-btn.send { background: var(--primary); color: var(--on-primary); }
.cmd-btn.send[hidden] { display: none; }
.cmd-btn.mic[aria-pressed="true"] { background: var(--badge); color: #fff; }
.cmd.listening input::placeholder { color: var(--text); font-weight: 600; }
.levels { display: none; gap: 3px; align-items: center; height: 20px; margin-right: 4px; }
.cmd.listening .levels { display: inline-flex; }
.levels i { display: block; width: 4px; height: 8px; border-radius: 2px; background: var(--badge); animation: lv 900ms ease-in-out infinite; }
.levels i:nth-child(2) { animation-delay: -300ms; } .levels i:nth-child(3) { animation-delay: -600ms; } .levels i:nth-child(4) { animation-delay: -150ms; }
@keyframes lv { 0%, 100% { height: 6px; } 50% { height: 20px; } }
@media (prefers-reduced-motion: reduce) { .levels i { animation: none; height: 14px; } }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.chips[hidden] { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 14px; border-radius: 24px;
  border: 1px solid var(--divider); background: var(--bg); font-size: 0.875rem; font-weight: 600; white-space: nowrap; color: var(--text);
}
.chip .icon { width: 18px; height: 18px; }
.chip.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

/* Confirmation with Undo, and the clarifying question, sit just above the bar. */
.bubble {
  display: flex; flex-direction: column; gap: 6px; padding: 10px 6px 6px 14px; border-radius: 18px;
  background: var(--text); color: var(--bg); box-shadow: var(--lift-shadow);
  animation: rise var(--dur-enter) var(--ease-emph-dec);
}
.bubble[hidden] { display: none; }
.bubble-row { display: flex; align-items: center; gap: 8px; }
.bubble-t { flex: 1; min-width: 0; font-size: 0.875rem; line-height: 1.35; }
.bubble-t b { font-weight: 700; }
.bubble .act { flex: none; min-height: 48px; min-width: 48px; padding: 0 12px; border-radius: 24px; font-weight: 700; font-size: 0.875rem; color: color-mix(in srgb, var(--primary) 45%, var(--bg)); }
.bubble.ask { background: var(--surface); color: var(--text); border: 1px solid var(--divider); padding: 10px 10px 10px 14px; }
.bubble.ask .q { display: flex; align-items: center; gap: 8px; font-size: 0.9375rem; font-weight: 600; }
.bubble.ask .q .icon { width: 18px; height: 18px; color: var(--primary); }
.bubble.ask .opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--divider); background: var(--bg); text-align: left; font-size: 0.875rem; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
.opt .s { color: var(--muted); font-size: 0.8125rem; }
.bubble.ask .act { color: var(--link); align-self: flex-end; }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }

/* Prototype badge: says what this is, opens nothing. */
.proto-note { font-size: 0.75rem; color: var(--muted); }
/* ===== Prototype A: the home board ===== */
.home {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 6px var(--pad) calc(var(--dock-h, 120px) + 24px);
  container-type: inline-size;
}
.board {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
  grid-auto-rows: calc((100cqw - 30px) / 4); grid-auto-flow: row dense;
}
.board > li { position: relative; min-width: 0; }
.board > li.s { grid-column: span 1; grid-row: span 1; }
.board > li.m { grid-column: span 2; grid-row: span 1; }
.board > li.l { grid-column: span 2; grid-row: span 2; }
.board > li.w { grid-column: span 4; grid-row: span 2; }

.tile {
  position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; align-items: stretch; gap: 4px;
  width: 100%; height: 100%; padding: 10px 12px; border-radius: 20px; text-align: left;
  border: 1px solid var(--divider); background: var(--surface); box-shadow: var(--card-shadow);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y;
  transition: transform var(--dur-short) var(--ease-std), box-shadow var(--dur-short);
}
.tile > :not(.wm) { position: relative; }
.board > li.s .tile { padding: 8px 9px; border-radius: 18px; gap: 0; justify-content: space-between; }
.tile:active { transform: scale(0.98); }
.tile.coach { border: var(--ring-w) solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box; }
.t-head { display: flex; align-items: center; gap: 7px; min-height: 24px; }
.t-ico { display: inline-flex; color: var(--ink, var(--text)); }
.t-ico .icon { width: 20px; height: 20px; stroke-width: 1.75; }
.coach .t-ico { color: var(--grad-2); }
.t-name { flex: 1; min-width: 0; font-size: 0.9375rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-meta { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.t-big { display: block; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-small { display: block; font-size: 0.6875rem; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: 0.875rem; line-height: 1.35; }
.l .t-text, .w .t-text { -webkit-line-clamp: 4; font-size: 1rem; font-weight: 600; }
.t-why { font-size: 0.8125rem; color: var(--muted); }
.t-open { margin-top: auto; display: inline-flex; align-items: center; gap: 2px; font-size: 0.8125rem; font-weight: 600; color: var(--link); }
.t-open .icon { width: 16px; height: 16px; stroke-width: 2; }
.t-lines { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; min-height: 0; overflow: hidden; }
.t-line { display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: 0.84375rem; }
.t-line > .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-line .tm { flex: none; min-width: 40px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink, var(--text)); }
.t-ring { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink, var(--muted)); }
.t-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--ink, var(--muted)); }
.t-progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: auto; }
.t-progress i { display: block; height: 100%; background: var(--mint-ink); border-radius: 3px; }
.t-bars { margin-top: auto; display: flex; align-items: flex-end; gap: 5px; height: 46%; }
.t-bars i { flex: 1; border-radius: 4px 4px 2px 2px; background: var(--teal-2); }
.t-bars i.est { background: repeating-linear-gradient(45deg, var(--teal-2) 0 3px, var(--teal) 3px 6px); }
.tile .wm { width: 96px; height: 96px; top: -14px; right: -18px; }
.board > li.s .wm { display: none; }

/* Edit mode: dashed outlines, a drag handle, no jiggle (calm). */
.app.editing .tile { outline: 2px dashed color-mix(in srgb, var(--muted) 70%, transparent); outline-offset: -2px; }
.app.editing .tile[aria-pressed="true"] { outline: 3px solid var(--primary); outline-offset: 1px; }
.tile > .handle { display: none; position: absolute; top: 2px; right: 2px; width: 28px; height: 28px; align-items: center; justify-content: center; color: var(--muted); z-index: 2; }
.handle .icon { width: 18px; height: 18px; }
.app.editing .tile > .handle { display: inline-flex; }
.board > li.ph .tile { opacity: 0.35; box-shadow: none; }
.ghost { position: absolute; z-index: 40; pointer-events: none; margin: 0; }
.ghost .tile { box-shadow: var(--lift-shadow); transform: scale(1.04); outline: 3px solid var(--primary) !important; }
.ghost.settle { transition: transform 180ms var(--ease-std); }
.ghost.settle .tile { transform: none; transition: transform 180ms var(--ease-std); }

/* The edit sheet replaces the command bar while editing; everything sits in thumb reach. */
.editbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 35; display: flex; flex-direction: column; gap: 8px;
  padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0;
  background: var(--bg); border-top: 1px solid var(--divider); box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.12);
  animation: rise var(--dur-enter) var(--ease-emph-dec);
}
.editbar[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .editbar { animation: none; } }
.eb-grip { align-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--divider); }
.eb-sel { display: flex; align-items: center; gap: 8px; min-height: 48px; }
.eb-t { flex: 1; min-width: 0; font-size: 0.9375rem; font-weight: 700; }
.eb-t .hint { display: block; font-size: 0.8125rem; font-weight: 400; color: var(--muted); }
.eb-tools { display: flex; align-items: center; gap: 8px; }
.eb-btn {
  flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 48px; height: 48px; padding: 0 12px;
  border-radius: 24px; background: var(--surface); font-size: 0.875rem; font-weight: 600;
}
.eb-btn.icon-only { padding: 0; width: 48px; }
.seg { flex: 1; display: flex; min-width: 0; height: 54px; border-radius: 27px; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { flex: 1; min-width: 0; border-radius: 24px; font-size: 0.8125rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.seg button[aria-checked="true"] { background: var(--text); color: var(--bg); }
.seg-wrap { flex: 1; display: flex; min-width: 0; }
.eb-k { font-size: 0.8125rem; font-weight: 600; color: var(--muted); }
.eb-tray .chips { padding-top: 4px; }
.eb-tray .chip { border-style: dashed; }
.eb-empty { min-height: 48px; display: flex; align-items: center; font-size: 0.8125rem; color: var(--muted); }
.eb-actions { display: flex; gap: 8px; }
.eb-actions button { flex: 1; height: 48px; border-radius: 24px; font-weight: 700; }
.btn-tonal { background: var(--surface); }
.btn-fill { background: var(--primary); color: var(--on-primary); }
.app.editing .dock { display: none; }
.app.editing .home { padding-bottom: calc(var(--edit-h, 280px) + 24px); }

<div class="app" id="app">

    <button type="button" class="tb-btn" id="btn-theme" data-icon="contrast"></button>
    <button type="button" class="tb-btn" id="btn-edit" aria-pressed="false" data-icon="grid"></button>
  </header>
  <main class="home" id="home">
    <ul class="board" id="board"></ul>
    <p class="sr-only" id="edit-help" data-i18n="editHelp"></p>
  </main>
  <section class="page" id="page" hidden></section>
  <div class="dock" id="dock">
    <div class="bubble" id="bubble" hidden></div>
    <div class="chips" id="chips" role="group" hidden></div>
    <form class="cmd" id="cmd" autocomplete="off">
      <span class="cmd-plus" data-icon="spark" aria-hidden="true"></span>
      <span class="levels" aria-hidden="true"><i></i><i></i><i></i><i></i></span>

      <input id="cmd-input" type="text" enterkeyhint="send" spellcheck="false" data-i18n-ph="cmdPh">
      <button type="button" class="cmd-btn mic" id="cmd-mic" aria-pressed="false" data-i18n-aria="speak" data-icon="mic"></button>
      <button type="submit" class="cmd-btn send" id="cmd-send" hidden data-i18n-aria="send" data-icon="up"></button>
    </form>
  </div>
  <div class="editbar" id="editbar" role="region" aria-labelledby="eb-title" hidden>
    <span class="eb-grip" aria-hidden="true"></span>
    <div class="eb-sel">
      <p class="eb-t" id="eb-title"></p>
      <button type="button" class="eb-btn" id="eb-hide"><span data-icon="hide"></span><span data-i18n="hide">Hide</span></button>

        <button type="button" role="radio" data-size="l"></button>
        <button type="button" role="radio" data-size="w"></button>

    </div>
    <div class="eb-tray">

    /* ----- the mock interpreter ----- */
    function findFeature(s) {

  /* ---------- long-press, drag to reorder ---------- */
  var press = null, suppressClick = false, ghost = null, lastSwap = 0, scrollV = 0, scrollRaf = 0, lastPt = null;
  board.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  board.addEventListener("pointerdown", function (e) {
    var li = e.target.closest("li[data-id]");
    if (!li || (e.pointerType === "mouse" && e.button !== 0) || pageOpen) return;
    var id = li.getAttribute("data-id");
    var delay = editing ? (e.pointerType === "mouse" ? 0 : 180) : 450;
    press = { id: id, li: li, x0: e.clientX, y0: e.clientY, pid: e.pointerId, armed: false, dragging: false, longFired: false };
    var p = press;
    p.timer = setTimeout(function () {
      if (press !== p) return;
      p.armed = true;
      if (!editing) { p.longFired = true; setEditing(true); select(id); try { navigator.vibrate && navigator.vibrate(12); } catch (err) { /* no haptics */ } }
    }, delay);
  });
  board.addEventListener("pointermove", function (e) {
    if (!press || e.pointerId !== press.pid) return;
    if (press.dragging) { lastPt = { x: e.clientX, y: e.clientY }; dragTo(e.clientX, e.clientY); return; }
    var dist = Math.hypot(e.clientX - press.x0, e.clientY - press.y0);
    if (dist < 8) return;
    if (press.armed) startDrag(e);
    else { clearTimeout(press.timer); press = null; } // moved first: a scroll, not a press
  });
  function endPress(e, cancelled) {
    if (!press || (e && e.pointerId !== press.pid)) return;
    clearTimeout(press.timer);
    if (press.dragging) { if (cancelled) cancelDrag(); else drop(); }
    if (press.longFired || press.dragging) suppressClick = true;
    press = null;
  }
  board.addEventListener("pointerup", function (e) { endPress(e, false); });
  board.addEventListener("pointercancel", function (e) { endPress(e, true); });
  // Once a press is armed, the finger drags the tile instead of scrolling the board.
  board.addEventListener("touchmove", function (e) { if (press && (press.armed || press.dragging)) e.preventDefault(); }, { passive: false });

  function startDrag(e) {
    press.dragging = true;
    try { board.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
    press.order0 = layout.order.slice();
    if (selected !== press.id) select(press.id);
    var li = press.li, r = li.getBoundingClientRect(), ar = app.getBoundingClientRect();
    ghost = document.createElement("div");
    ghost.className = "ghost " + li.className;
    ghost.setAttribute("aria-hidden", "true");
    ghost.style.left = (r.left - ar.left) + "px"; ghost.style.top = (r.top - ar.top) + "px";
    ghost.style.width = r.width + "px"; ghost.style.height = r.height + "px";
    ghost.appendChild(li.firstChild.cloneNode(true));
    app.appendChild(ghost);
    press.gx = r.left; press.gy = r.top;
    li.classList.add("ph");
    lastPt = { x: e.clientX, y: e.clientY };
    S.announce(t("moving", { name: tx(F[press.id].name) }));
    dragTo(e.clientX, e.clientY);
  }
  function dragTo(x, y) {
    if (!ghost) return;
    ghost.style.transform = "translate(" + (x - press.x0) + "px," + (y - press.y0) + "px)";
    // Auto-scroll near the top and bottom of the board.
    var hr = home.getBoundingClientRect(), bottom = editbar.getBoundingClientRect().top;
    scrollV = y < hr.top + 56 ? -8 : y > bottom - 56 ? 8 : 0;
    if (scrollV && !scrollRaf) scrollRaf = requestAnimationFrame(autoScroll);
    var now = performance.now();
    if (now - lastSwap < 140) return;
    var el = document.elementFromPoint(x, y), target = el && el.closest && el.closest("#board > li[data-id]");
    if (!target || target === press.li) return;
    var tid = target.getAttribute("data-id"), from = layout.order.indexOf(press.id), to = layout.order.indexOf(tid);
    if (from < 0 || to < 0) return;
    lastSwap = now;
    flip(function () { layout.order.splice(from, 1); layout.order.splice(to, 0, press.id); });
  }
  function autoScroll() {
    scrollRaf = 0;
    if (!press || !press.dragging || !scrollV) return;
    home.scrollTop += scrollV;
    if (lastPt) dragTo(lastPt.x, lastPt.y);
    scrollRaf = requestAnimationFrame(autoScroll);
  }
  function finishGhost(id) {
    var li = lis[id], g = ghost; ghost = null; scrollV = 0;
    if (!g) return;
    var done = function () { if (g.parentNode) g.parentNode.removeChild(g); li.classList.remove("ph"); };
    if (S.reducedMotion()) { done(); return; }
    var r = li.getBoundingClientRect(), ar = app.getBoundingClientRect();
    g.classList.add("settle");
    g.style.transform = "translate(" + (r.left - ar.left - parseFloat(g.style.left)) + "px," + (r.top - ar.top - parseFloat(g.style.top)) + "px)";
    setTimeout(done, 190);
  }
  function drop() {
    var id = press.id;
    finishGhost(id);
    save(); renderBoard(); renderEditbar();
    S.announce(t("movedTo", { name: tx(F[id].name), i: layout.order.indexOf(id) + 1, n: layout.order.length }));
  }
  function cancelDrag() {
    var id = press.id;
    flip(function () { layout.order = press.order0; });
    finishGhost(id);
  }

  board.addEventListener("click", function (e) {
    if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
    var li = e.target.closest("li[data-id]"); if (!li) return;
    var id = li.getAttribute("data-id");
    if (editing) select(selected === id ? null : id);
    else openPage(id, li.firstChild);
  });
  board.addEventListener("keydown", function (e) {
    if (!editing) return;
    var li = e.target.closest("li[data-id]"); if (!li) return;
    var id = li.getAttribute("data-id"), k = e.key;
    if (k === "ArrowLeft" || k === "ArrowUp" || k === "ArrowRight" || k === "ArrowDown") {
      e.preventDefault();
      if (selected !== id) select(id);
      move(id, k === "ArrowLeft" || k === "ArrowUp" ? -1 : 1);
      lis[id].firstChild.focus();
    } else if (k === "Delete" || k === "Backspace") { e.preventDefault(); hideTile(id); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && editing && !pageOpen) { setEditing(false); $("btn-edit").focus(); }
  });

  /* ---------- container transform: a tile grows into its page ---------- */
  function relRect(el) {
    var r = el.getBoundingClientRect(), a = app.getBoundingClientRect();
    return { top: r.top - a.top, left: r.left - a.left, right: a.right - r.right, bottom: a.bottom - r.bottom, radius: parseFloat(getComputedStyle(el).borderTopLeftRadius) || 20 };
  }
  function inset(r) { return "inset(" + r.top + "px " + r.right + "px " + r.bottom + "px " + r.left + "px round " + r.radius + "px)"; }
  function setInert(on) {
    [home, topbar].forEach(function (el) { if (on) el.setAttribute("inert", ""); else el.removeAttribute("inert"); });
  }
  var pageTimer = 0;
  function openPage(id, fromEl, via) {
    S.Cmd.hideBubble();
    if (editing) setEditing(false, true);
    if (pageOpen) { // already on a page (opened from the bar): swap its content
      pageOpen = id; S.fillPage(page, id); page.querySelector("h1").focus(); return;
    }
    var tile = fromEl || (lis[id] && lis[id].parentNode ? lis[id].firstChild : null);
    if (tile && via === "command") {
      var r0 = tile.getBoundingClientRect(), hr = home.getBoundingClientRect();
      if (r0.top < hr.top || r0.bottom > hr.bottom) tile.scrollIntoView({ block: "nearest" });
    }
    pageOpen = id;
    S.fillPage(page, id);
    page.hidden = false;
    clearTimeout(pageTimer);
    page.style.transition = "none";
    if (tile && !S.reducedMotion()) {
      page.style.clipPath = inset(relRect(tile));
      page.style.backgroundColor = "var(--surface)";
      page.classList.add("entering");
      page.offsetWidth;
      page.style.transition = "clip-path var(--dur-enter) var(--ease-emph-dec), background-color var(--dur-enter) linear";
      page.style.clipPath = "inset(0px 0px 0px 0px round 0px)";
      page.style.backgroundColor = "";
      tile.style.visibility = "hidden";
      setTimeout(function () { page.classList.remove("entering"); }, 110);
      pageTimer = setTimeout(function () { tile.style.visibility = ""; page.style.clipPath = ""; page.style.transition = ""; }, 460);
    } else { // fade (reduced motion, or no tile on the board for this feature)
      page.style.opacity = "0";
      page.offsetWidth;
      page.style.transition = "opacity var(--dur-short) linear";
      page.style.opacity = "1";
      pageTimer = setTimeout(function () { page.style.transition = ""; }, 200);
    }
    setInert(true);
    S.Nav.push();
    page.querySelector("h1").focus({ preventScroll: true });
  }
  function closePage() {
    if (!pageOpen) return;
    var id = pageOpen;
    pageOpen = null;
    clearTimeout(pageTimer);
    setInert(false);
    var tile = lis[id] && lis[id].parentNode ? lis[id].firstChild : null;
    var finish = function () {
      page.hidden = true; page.style.cssText = ""; page.classList.remove("entering");
      if (tile) { tile.style.visibility = ""; tile.focus({ preventScroll: true }); } else $("cmd-input").focus({ preventScroll: true });
    };
    if (tile) {
      var r = tile.getBoundingClientRect(), hr = home.getBoundingClientRect();
      if (r.top < hr.top || r.bottom > hr.bottom) tile.scrollIntoView({ block: "nearest" });
    }
    if (tile && !S.reducedMotion()) {
      tile.style.visibility = "hidden";
      page.style.transition = "clip-path var(--dur-exit) var(--ease-emph-acc), background-color var(--dur-exit) linear";
      page.style.clipPath = "inset(0px 0px 0px 0px round 0px)";
      page.offsetWidth;
      page.classList.add("entering");
      page.style.clipPath = inset(relRect(tile));
      page.style.backgroundColor = "var(--surface)";
      pageTimer = setTimeout(finish, 280);
    } else {
      page.style.transition = "opacity var(--dur-short) linear";
      page.style.opacity = "0";
      pageTimer = setTimeout(finish, S.reducedMotion() ? 20 : 170);
    }
  }
  window.addEventListener("popstate", function () {
    if (S.Nav.skipNext) { S.Nav.skipNext = false; return; }
    S.Nav.consumed();
    if (pageOpen) closePage();
  });
  page.addEventListener("click", function (e) {
    S.pageClick(e, { back: function () { S.Nav.back(closePage); }, refresh: function () { renderBoard(); } });
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && pageOpen && !document.activeElement.closest("#dock")) S.Nav.back(closePage); });

  /* ---------- sizes of the bottom areas ---------- */
  function measure() {
    app.style.setProperty("--dock-h", dock.offsetHeight + "px");
    if (editing) app.style.setProperty("--edit-h", editbar.offsetHeight + "px");
  }
  if (window.ResizeObserver) { var ro = new ResizeObserver(measure); ro.observe(dock); ro.observe(editbar); }

  /* ---------- start ---------- */
  function refreshAll(fromPage) {
    renderBoard();
    if (editing) renderEditbar();
    if (pageOpen && !fromPage) { var sc = page.querySelector(".page-body"), top = sc ? sc.scrollTop : 0; S.fillPage(page, pageOpen); var nb = page.querySelector(".page-body"); if (nb) nb.scrollTop = top; }
    $("date").textContent = S.dateLine();
    $("title").textContent = editing ? t("editTitle") : t("home");
    $("btn-edit").setAttribute("aria-label", editing ? t("doneEditing") : t("editHome"));
  }
  S.fillIcons();
  S.applyStatic();
  S.wireTopbar(function () { refreshAll(); });
  S.Cmd.init({
    open: function (id) { openPage(id, null, "command"); },
    refresh: function () { refreshAll(); },
    layout: measure
  });
  refreshAll();
  measure();
  // Test hooks for the prototype (not part of any design).
  window.__proto = { layout: function () { return JSON.parse(JSON.stringify(layout)); }, KEY: KEY };
})();
</script>
</body>
</html>

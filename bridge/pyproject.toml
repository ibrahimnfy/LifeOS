[project]
name = "lifeos-bridge"
version = "0.1.0"
description = "LifeOS bridge: a small private HTTP server that runs Claude Code headless for the phone app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-auth>=2.30",
    "uvicorn>=0.32",
]

[project.scripts]
lifeos-bridge = "lifeos_bridge.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifeos_bridge"]

[tool.uv]
# Use the Python that is already installed; never download an interpreter.
python-downloads = "never"
python-preference = "only-system"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
